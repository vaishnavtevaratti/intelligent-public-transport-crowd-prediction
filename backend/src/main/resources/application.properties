# Application Name & Port
spring.application.name=transport-backend
server.port=${SERVER_PORT:8080}

# Secrets are NOT stored in this file. They come from environment variables or from the
# git-ignored file backend/application-local.properties (see application-local.properties.example).
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/transport_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate Configuration
# "update" adds new tables/columns without dropping existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (secret must be at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Code required to self-register as ADMIN. Leave empty to disable admin self-registration
# (admins can still promote users from the admin panel).
app.auth.admin-registration-code=${ADMIN_REGISTRATION_CODE:}

# Allowed browser origins for REST and WebSocket (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Crowd prediction ML service (Python, see ml-service/)
app.ml.base-url=${ML_SERVICE_URL:http://127.0.0.1:8001}
app.ml.timeout-ms=10000

# Optional Google Routes API for road distance / ride time in the travel planner.
# SERVER-SIDE key restricted to the Routes API (not the browser Maps key). Empty = straight-line estimates.
app.routing.google.api-key=${GOOGLE_ROUTES_API_KEY:}

# Local counter agent (vision-service/agent.py) used by Admin > Occupancy & Sensors to start/stop counters.
# The token is read from the agent's token file unless VISION_AGENT_TOKEN is set.
app.vision-agent.base-url=${VISION_AGENT_URL:http://127.0.0.1:8002}
app.vision-agent.token=${VISION_AGENT_TOKEN:}
app.vision-agent.token-file=${VISION_AGENT_TOKEN_FILE:../vision-service/agent_token.txt}

# Simulated GPS (SRS: simulated bus movement, ~5 second updates)
app.simulation.enabled=${SIMULATION_ENABLED:true}
app.simulation.interval-ms=5000
app.simulation.average-speed-kmph=28
# Simulated passenger counts (labelled SIMULATED) for buses that have no passenger-counting sensor
app.simulation.passengers.enabled=${SIMULATE_PASSENGERS:true}
app.simulation.passengers.interval-ms=30000

# Scheduled crowd predictions for active buses and data retention
app.crowd.prediction-interval-ms=300000
app.crowd.scheduled-retention-days=30
app.location.retention-hours=24

# Crowd categories by occupancy = estimated onboard / total passenger capacity (seats + standing)
app.crowd.thresholds.medium=0.50
app.crowd.thresholds.high=0.85
app.crowd.thresholds.full=1.00

# Live occupancy: an onboard estimate older than this is shown as STALE and not used for live forecasts
app.occupancy.stale-after-seconds=120
# Measured occupied seats (seat sensor / manual count) are shown for this long
app.occupancy.seat-valid-seconds=300
app.occupancy.retention-days=30
# A sensor that has not reported for this long is shown as offline
app.sensors.offline-after-seconds=60

# Seed demo users/routes/buses only when the tables are empty
app.seed.demo-data=${SEED_DEMO_DATA:true}

# Never send stack traces or exception messages to clients
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
