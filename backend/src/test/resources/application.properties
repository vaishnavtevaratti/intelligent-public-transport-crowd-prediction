# Test configuration: in-memory H2 database, no background jobs, no demo data.
spring.datasource.url=jdbc:h2:mem:transport_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-signing
app.jwt.expiration-ms=3600000
app.auth.admin-registration-code=test-admin-code
app.cors.allowed-origins=http://localhost:5173
app.ml.base-url=http://127.0.0.1:1
app.ml.timeout-ms=500
app.simulation.enabled=false
app.simulation.interval-ms=5000
app.simulation.average-speed-kmph=30
app.crowd.prediction-interval-ms=300000
app.crowd.scheduled-retention-days=30
app.location.retention-hours=24
app.seed.demo-data=false
app.scheduling.enabled=false
server.error.include-message=never
